name: Notify Website of README Change

# Tells professorshroom.com to re-sync this README and redeploy.
# Needs the WEBSITE_DISPATCH_TOKEN secret: a fine-grained PAT with
# Contents: read & write on ProfessorShroom/professorshroom.com.

on:
  push:
    branches: [master]
    paths:
      - "README.md"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to website
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
        run: |
          gh api repos/ProfessorShroom/professorshroom.com/dispatches \
            -f event_type=readme-updated \
            -f "client_payload[repo]=${{ github.repository }}"
